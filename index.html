<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoolaSpeak</title>
  <link rel="icon" href="https://res.cloudinary.com/ddp0dj208/image/upload/v1763602068/noolaspeak_v8ayqx.webp" type="image/webp" />
  <link rel="icon" href="https://res.cloudinary.com/ddp0dj208/image/upload/v1763602068/noolaspeak_v8ayqx.webp" sizes="32x32" type="image/webp" />
  <link rel="apple-touch-icon" href="https://res.cloudinary.com/ddp0dj208/image/upload/v1763602068/noolaspeak_v8ayqx.webp" />
  <link rel="icon" href="https://res.cloudinary.com/ddp0dj208/image/upload/f_png/v1763602068/noolaspeak_v8ayqx.webp" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#4f46e5',
            secondary: '#10b981',
            accent: '#f59e0b',
            dark: '#1e293b',
          },
        },
      },
    };
  </script>
  <style>
    /* Custom scrollbar for cleaner look */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .typing-dot {
      animation: typing 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .typing-dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes typing {

      0%,
      80%,
      100% {
        transform: scale(0);
      }

      40% {
        transform: scale(1);
      }
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 antialiased overflow-hidden h-screen">
  <div id="root" class="h-full"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
